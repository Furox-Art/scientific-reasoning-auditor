[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-reasoning-auditor"
version = "0.8.0"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furox-Art" }]
description = "Evidence-traceable screening and reasoning review for scientific manuscripts"
keywords = ["scientific-reasoning", "reproducibility", "manuscript-review", "statistics", "research-software"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Furox-Art/scientific-reasoning-auditor"
Repository = "https://github.com/Furox-Art/scientific-reasoning-auditor"
Issues = "https://github.com/Furox-Art/scientific-reasoning-auditor/issues"

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
statistics = ["scipy>=1.11"]
dev = ["coverage<9,>=7", "jsonschema<5,>=4.20", "build<2,>=1.2", "twine<8,>=6"]

[project.scripts]
sra = "sra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.report]
# The suite covers every statement: `coverage run --source=src/sra -m unittest
# discover -s tests` reports 3554 statements, 0 missed on this tree. The gate
# turns that measurement into a contract. Branch coverage is deliberately not
# enabled here: it was never measured, so turning it on could lower the number
# for reasons unrelated to this change.
fail_under = 100
