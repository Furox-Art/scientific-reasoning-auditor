[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-reasoning-auditor"
version = "0.1.0"
description = "Evidence-grounded screening of scientific manuscripts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Furox-Art" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]

[project.scripts]
sra = "sra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
