name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        node-version: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[pdf,statistics,logic,dev]"
      - run: python -m compileall -q src tests tools
      - run: python -m coverage run --source=src/sra -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=100
      - run: PYTHONPATH=src python tools/evaluate_heuristics.py --require-perfect-on-synthetic
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - name: Install distribution validation tools
        run: python -m pip install build twine
      - name: Build and independently compare reproducible distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --outdir "$RUNNER_TEMP/sra-dist"
          python tools/normalize_sdist.py "$RUNNER_TEMP"/sra-dist/*.tar.gz
          python -m build --outdir "$RUNNER_TEMP/sra-dist-repeat"
          python tools/normalize_sdist.py "$RUNNER_TEMP"/sra-dist-repeat/*.tar.gz
          python tools/verify_reproducible_distributions.py "$RUNNER_TEMP/sra-dist" "$RUNNER_TEMP/sra-dist-repeat"
      - name: Verify distribution provenance inventories
        run: python tools/verify_distributions.py "$RUNNER_TEMP/sra-dist"
      - name: Validate distribution metadata
        run: python -m twine check "$RUNNER_TEMP"/sra-dist/*

  real-pdf-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install independent local PDF OCR engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils fonts-dejavu-core
      - name: Install synthetic fixture generation dependencies
        run: python -m pip install -e ".[pdf]" Pillow reportlab
      - name: Verify actual scanned PDF recovery and page provenance
        run: PYTHONPATH=src python tools/verify_real_pdf_ocr.py
