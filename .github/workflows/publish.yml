name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require tagged commit to be reachable from main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release refused: tag target is not an ancestor of origin/main." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")
          print(f"Building {version}")
          PY

      - name: Install audited runtime and test dependencies
        run: python -m pip install ".[pdf,statistics,dev]"

      - name: Test Python on the exact release tag
        run: python -m coverage run --source=src/sra -m unittest discover -s tests -v

      - name: Enforce minimum measured code coverage
        run: python -m coverage report --fail-under=100

      - name: Verify synthetic regression benchmark
        run: PYTHONPATH=src python tools/evaluate_heuristics.py --require-perfect-on-synthetic

      - name: Set up Node.js for adapter tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Test Node.js adapter before PyPI release
        run: npm test

      - name: Build and independently compare reproducible distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build
          python tools/normalize_sdist.py dist/*.tar.gz
          python -m build --outdir "$RUNNER_TEMP/sra-dist-repeat"
          python tools/normalize_sdist.py "$RUNNER_TEMP"/sra-dist-repeat/*.tar.gz
          python tools/verify_reproducible_distributions.py dist "$RUNNER_TEMP/sra-dist-repeat"

      - name: Verify distribution provenance inventories
        env:
          PYTHONPATH: src
        run: python tools/verify_distributions.py dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scientific-reasoning-auditor
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
