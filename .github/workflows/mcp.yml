name: MCP adapter tests

on:
  push:
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp.yml"
      - "src/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "mcp_server/**"
      - ".github/workflows/mcp.yml"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core engine and optional MCP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pdf,statistics,logic,toolkit]" -r mcp_server/requirements.txt
      - name: Compile all MCP code
        run: python -m compileall -q mcp_server
      - name: Real-engine, authentication and protocol tests
        run: python -m unittest discover -s mcp_server/tests -v
